<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Na Wazungu - Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    <div class="card">
        <div class="card-header" style="margin-bottom: 24px;">
            <div class="logo-container">
                <div class="logo-circle">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
            </div>
            <h2 class="site-title">CHAT NA WAZUNGU</h2>
        </div>

        <div class="card-body">
            <h1 class="main-title" style="text-align: center;">Welcome back</h1>
            <p class="subtitle" style="text-align: center;">Sign in to your account</p>

            <form>
                <div class="input-group">
                    <label for="login-email">EMAIL</label>
                    <div class="input-wrapper">
                        <input type="email" id="login-email" placeholder="you@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="login-password">PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" placeholder="Your password" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <div class="footer-link">
                Don't have an account? <a href="register.html" class="sign-in-link">Sign up</a>
            </div>
        </div>
    </div>
    
    <div class="page-footer">
        © 2026 Chat Na Wazungu · No-Refund Policy
    </div>
</body>
</html>
